
services:
  - type: web
    name: wedding-memories-backend
    runtime: python
    region: oregon
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: "Wedding Memories"

      - key: APP_ENV
        value: "production"

      - key: DEBUG
        value: "false"

      - key: API_V1_PREFIX
        value: "/api/v1"

      - key: PHOTO_STORAGE_PROVIDER
        value: "google_drive"

      - key: PHOTO_STORAGE_LOCAL_PATH
        value: "/opt/render/project/src/storage-data"

      - key: JWT_ALGORITHM
        value: "HS256"

      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: UPLOAD_SESSION_MINUTES
        value: "30"

      - key: UPLOAD_MAX_FILE_BYTES
        value: "12582912"

      - key: UPLOAD_MAX_REQUEST_BYTES
        value: "57671680"

      - key: UPLOAD_MAX_FILES_PER_REQUEST
        value: "10"

      - key: UPLOAD_MAX_FILES_PER_SESSION
        value: "30"

      - key: UPLOAD_MAX_BYTES_PER_SESSION
        value: "104857600"

      - key: UPLOAD_SESSIONS_PER_IP_PER_HOUR
        value: "20"

      - key: UPLOAD_REQUESTS_PER_IP_PER_HOUR
        value: "30"
